name: iOS CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  test:
    name: Run Tests
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      # Runner images change their simulator list over time, so a fixed
      # device name breaks. Pick an available Apple Watch on the newest runtime.
      - name: Pick watchOS simulator
        id: sim
        run: |
          SIM_ID=$(xcrun simctl list devices available -j | python3 -c '
          import json, re, sys
          devices = json.load(sys.stdin)["devices"]
          def version(runtime):
              return [int(n) for n in re.findall(r"\d+", runtime.split("watchOS-")[-1])]
          runtimes = sorted((r for r in devices if "watchOS" in r and devices[r]), key=version)
          print(devices[runtimes[-1]][0]["udid"] if runtimes else "")
          ')
          if [ -z "$SIM_ID" ]; then
            echo "No watchOS simulator is available on this runner." >&2
            xcrun simctl list devices available
            exit 1
          fi
          echo "Using simulator $SIM_ID"
          echo "id=$SIM_ID" >> "$GITHUB_OUTPUT"
      - name: Run xcodebuild
        run: xcodebuild test -scheme "GroceryWatch Watch App" -project ios/GroceryWatch/GroceryWatch.xcodeproj -destination "id=${{ steps.sim.outputs.id }}"
